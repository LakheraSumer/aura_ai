[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -p no:cacheprovider
markers =
    integration: needs the docker-compose stack (Postgres, Temporal) - run with `-m integration`
    browser: needs Playwright Chromium installed
filterwarnings =
    ignore::DeprecationWarning:temporalio.*
