[project]
name = "apna"
version = "0.1.0"
description = "Apna AI backend: API, agent runtime, Temporal workflows, browser worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "anthropic>=1.0",
  "openai>=1.0",
  "cryptography>=43",
  "temporalio>=1.7",
  "playwright>=1.45",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "structlog>=24.1",
  "pgvector>=0.3",
  "tzdata>=2024.1",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["../../tests"]
markers = [
  "integration: needs the docker-compose stack (Postgres, Temporal)",
  "browser: needs Playwright Chromium installed",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"../../tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
